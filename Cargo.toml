[package]
name = "algorithm-agents"
version = "1.0.0"
edition = "2024"
description = "Session-scoped multi-agent runtime that discovers, extracts, reviews, and saves algorithms"
license = "MIT"
readme = "README.md"
keywords = ["algorithms", "agents", "research", "extraction"]
categories = ["command-line-utilities", "science"]
publish = false
repository = "https://github.com/jacksonjp0311-gif/algorithm-agents"
homepage = "https://github.com/jacksonjp0311-gif/algorithm-agents"

[lib]
name = "agent_system"
path = "src/lib.rs"

[[bin]]
name = "algo"
path = "src/bin/algo.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "time"] }
thiserror = "2"
time = { version = "=0.3.41", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
