name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec scanner
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +stable audit
